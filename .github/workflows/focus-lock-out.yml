name: Focus Lock Out

on:
  push:
    paths:
      - "FocusLockOut/**"
      - ".github/workflows/focus-lock-out.yml"
  pull_request:
    paths:
      - "FocusLockOut/**"
      - ".github/workflows/focus-lock-out.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FocusLockOut
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and unit test
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: focus-lock-out-debug-apk
          path: FocusLockOut/app/build/outputs/apk/debug/*.apk
